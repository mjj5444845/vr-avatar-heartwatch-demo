<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR Avatar Heart Watch Demo</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">VR Avatar + Apple Watch</p>
            <h1>Heart-aware avatar demo</h1>
          </div>
          <div class="actions">
            <button id="sensorToggle" class="primary">Start sensor</button>
            <button id="addVrEvent">Log VR event</button>
            <button id="exportData">Export JSON</button>
            <button id="resetData" class="ghost">Reset</button>
          </div>
        </header>

        <section class="hero-grid">
          <div class="vr-panel">
            <a-scene embedded vr-mode-ui="enabled: true" renderer="antialias: true">
              <a-assets>
                <img id="gridTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" />
              </a-assets>
              <a-sky color="#dce8f7"></a-sky>
              <a-plane src="#gridTexture" rotation="-90 0 0" width="18" height="18"></a-plane>
              <a-entity id="avatarRig" position="0 1.35 -3">
                <a-sphere id="avatarHead" color="#5f7cff" radius="0.42" position="0 0.86 0"></a-sphere>
                <a-cylinder id="avatarBody" color="#222c3f" radius="0.34" height="1.05" position="0 0.18 0"></a-cylinder>
                <a-torus id="avatarAura" color="#34c759" radius="0.72" radius-tubular="0.018" position="0 0.62 0" rotation="90 0 0"></a-torus>
                <a-text id="avatarSpeech" value="Ready when your heart is." align="center" color="#111827" width="4" position="0 1.58 0"></a-text>
              </a-entity>
              <a-light type="ambient" intensity="0.7"></a-light>
              <a-light type="directional" position="2 4 2" intensity="0.6"></a-light>
              <a-camera position="0 1.6 0"></a-camera>
            </a-scene>
          </div>

          <aside class="live-card">
            <span class="status-pill" id="sensorStatus">Sensor idle</span>
            <div class="metric">
              <span id="heartRateValue">--</span>
              <small>bpm</small>
            </div>
            <p id="zoneLabel">Waiting for Apple Watch data</p>
            <div id="chart" class="chart" aria-label="Heart rate chart"></div>
            <div class="avatar-message">
              <strong>Avatar</strong>
              <p id="avatarMessage">Start the sensor to begin the session.</p>
            </div>
          </aside>
        </section>

        <section class="dashboard-grid">
          <article>
            <h2>Heart-rate records</h2>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Heart rate</th>
                    <th>Zone</th>
                    <th>Source</th>
                  </tr>
                </thead>
                <tbody id="sampleRows"></tbody>
              </table>
            </div>
          </article>

          <article>
            <h2>Session events</h2>
            <div id="eventFeed" class="event-feed"></div>
          </article>
        </section>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
